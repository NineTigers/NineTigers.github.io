<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스토리아: 디펜스</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 70% 20%, #123b5c, #050b18 52%, #12081e); color: #eefcff; }
    main { width: min(760px, calc(100% - 40px)); }
    small { color: #22d3ee; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: .35em 0 .2em; font-size: clamp(3rem, 10vw, 6rem); line-height: .9; }
    p { max-width: 620px; color: #b7c7dc; font-size: 1.1rem; line-height: 1.6; }
    nav { display: flex; gap: 18px; margin-top: 28px; color: #8fa3ba; }
    a { color: #67e8f9; }
  </style>
</head>
<body>
  <main>
    <small>STORIA // PORTRAIT DEFENSE</small>
    <h1>스토리아:<br>디펜스</h1>
    <p>전투 코어를 소환하고 합성해 전열을 구축하세요. 변화하는 공세를 읽고 자원을 운용해 방어선을 지켜내야 합니다.</p>
    <nav>개인정보 처리방침과 고객지원 페이지를 준비하고 있습니다.</nav>
  </main>
</body>
</html>
